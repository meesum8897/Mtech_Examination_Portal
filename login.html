<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M-TECH Examination Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    position:relative;
    background:url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
}

/* OVERLAY */

.overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(255,255,255,.88);
    top:0;
    left:0;
}

/* TOP HEADER */

.top-header{
    position:relative;
    z-index:2;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding-top:25px;
}

.top-header img{
    width:240px;
}

/* LOGIN WRAPPER */

.login-wrapper{
    position:relative;
    z-index:2;

    width:100%;
    height:calc(100vh - 100px);

    display:flex;
    justify-content:center;
    align-items:center;
}

/* LOGIN BOX */

.login-box{
    width:520px;
    background:white;
    border-radius:18px;
    overflow:hidden;

    box-shadow:
    0 10px 30px rgba(0,0,0,.08),
    0 2px 10px rgba(0,0,0,.05);
}

/* LOGIN HEADER */

.login-header{
    background:linear-gradient(
        to right,
        rgb(250,163,29),
        #ffb84d
    );

    padding:18px 25px;
    color:black;
}

.login-header h2{
    font-size:26px;
    font-weight:700;
}

/* LOGIN BODY */

.login-body{
    padding:35px;
}

/* INPUT GROUP */

.input-group{
    margin-bottom:22px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    color:#374151;
    font-weight:500;
}

.input-group input{
    width:100%;
    height:55px;

    border:1px solid #d1d5db;
    border-radius:12px;

    padding:0 18px;
    font-size:15px;

    transition:.3s;
    outline:none;
}

.input-group input:focus{
    border-color:rgb(250,163,29);

    box-shadow:
    0 0 0 4px rgba(250,163,29,.15);
}

/* LOGIN BUTTON */

.login-btn{
    width:100%;
    height:55px;

    border:none;
    border-radius:12px;

    background:black;
    color:white;

    font-size:17px;
    font-weight:600;

    cursor:pointer;
    transition:.3s;
}

.login-btn:hover{
    background:rgb(250,163,29);
    color:black;

    transform:translateY(-2px);
}

/* FOOTER */

.footer{
    margin-top:20px;
    text-align:center;
    font-size:13px;
    color:#4b5563;
}

/* RESPONSIVE */

@media(max-width:600px){

    .login-box{
        width:92%;
    }

    .top-header img{
        width:180px;
    }

}

</style>
</head>

<body>

<div class="overlay"></div>

<!-- HEADER -->

<div class="top-header">

    <img src="https://mtechinstitute.com/wp-content/uploads/2025/03/weblogoblue.png" alt="MTECH Logo">

</div>

<!-- LOGIN -->

<div class="login-wrapper">

    <div class="login-box">

        <!-- HEADER -->

        <div class="login-header">
            <h2>Login Here</h2>
        </div>

        <!-- BODY -->

        <div class="login-body">

            <div class="input-group">
                <label>Student ID</label>
                <input type="text" placeholder="Enter Student ID">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Enter Password">
            </div>

            <button class="login-btn">
                Login
            </button>

            <div class="footer">
                © 2026 M-TECH Institute Examination System
            </div>

        </div>

    </div>

</div>

</body>
</html>
